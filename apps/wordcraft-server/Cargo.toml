[package]
name = "wordcraft-server"
description = "Local document persistence and collaboration service for WordCraft"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "wordcraft-server"
path = "src/main.rs"

[[bin]]
name = "wordcraft-backup"
path = "src/bin/wordcraft-backup.rs"

[dependencies]
axum = { workspace = true }
fs2 = "0.4"
futures-util = "0.3"
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
uuid = { workspace = true }
wordcraft-doc = { workspace = true }
wordcraft-engine = { workspace = true }
yrs = { workspace = true }

[dev-dependencies]
tokio-tungstenite = "0.29"
